name: MLOps Edge Security Pipeline - Feature Branch

on:
  push:
    branches: [ feature/add ]
    paths:
      - 'app/**'
      - 'models.dvc'
      - 'data.dvc'
      - 'scripts/**'
      - 'requirements.txt'
      - 'setup.py'
  
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Mode de test détaillé'
        required: false
        default: 'basic'
        type: choice
        options:
          - basic
          - full
          - benchmark-only

env:
  MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI || 'http://localhost:5000' }}
  PYTHON_VERSION: '3.9'
  DVC_CACHE_DIR: '/tmp/dvc-cache'

jobs:
  # ===========================================
  # JOB 1: SETUP ET VALIDATION BRANCHE FEATURE
  # ===========================================
  setup-and-validation:
    name: Setup et validation - Branche Feature
    runs-on: ubuntu-latest-4-cores
    timeout-minutes: 15

    outputs:
      models_exist: ${{ steps.check-models.outputs.exist }}
      models_count: ${{ steps.check-models.outputs.count }}
      setup_success: ${{ steps.validate-setup.outputs.success }}

    steps:
      - name: Checkout de la branche feature/add
        id: get-branch
        uses: actions/checkout@v4
        with:
          ref: feature/add
          fetch-depth: 0

      - name: Information sur la branche
        run: |
          echo "Branche actuelle: ${{ github.ref }}"
          echo "Nom de branche: ${{ github.ref_name }}"
          echo "SHA du commit: ${{ github.sha }}"
          echo "Auteur: ${{ github.actor }}"

      - name: Configuration Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: '**/requirements.txt'

      - name: Installation DVC avec support Google Drive
        run: |
          pip install "dvc[gdrive]==3.41.0" pydrive2==1.16.0
          dvc version

      - name: Configuration Google Drive Credentials
        if: ${{ secrets.GDRIVE_CREDENTIALS_JSON != '' }}
        run: |
          mkdir -p ~/.config/dvc/tmp
          echo "${{ secrets.GDRIVE_CREDENTIALS_JSON }}" > ~/.config/dvc/tmp/gdrive-user-credentials.json
          
          # Validation JSON
          python -m json.tool ~/.config/dvc/tmp/gdrive-user-credentials.json >/dev/null || {
            echo "ERREUR: JSON credentials invalide"
            exit 1
          }

      - name: Vérification présence secret GDRIVE
        if: ${{ secrets.GDRIVE_CREDENTIALS_JSON == '' }}
        run: |
          echo "ERREUR CRITIQUE: Secret GDRIVE_CREDENTIALS_JSON non configuré"
          exit 1

      - name: Récupération des modèles DVC
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ~/.config/dvc/tmp/gdrive-user-credentials.json
        run: |
          if [ ! -f "models.dvc" ]; then
            echo "Fichier models.dvc non trouvé"
            ls -la *.dvc || echo "Aucun fichier .dvc"
            exit 1
          fi
          
          dvc pull models.dvc --verbose || exit 1

      - name: Vérification des modèles
        id: check-models
        run: |
          if [ ! -d "models" ]; then
            echo "ERREUR: Dossier 'models/' non trouvé"
            echo "exist=false" >> $GITHUB_OUTPUT
            echo "count=0" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          count=$(find models -name "*.tflite" -type f | wc -l)
          echo "Modèles .tflite trouvés: $count"
          
          if [ $count -gt 0 ]; then
            echo "exist=true" >> $GITHUB_OUTPUT
            echo "count=$count" >> $GITHUB_OUTPUT
            
            echo "Liste des modèles:"
            for model in models/*.tflite; do
              [ -f "$model" ] || continue
              size_mb=$(echo "scale=2; $(stat -c%s "$model" 2>/dev/null || stat -f%z "$model") / 1048576" | bc)
              echo "  - $(basename "$model") : ${size_mb} MB"
            done
          else
            echo "exist=false" >> $GITHUB_OUTPUT
            echo "count=0" >> $GITHUB_OUTPUT
          fi

      - name: Installation des dépendances et validation
        id: validate-setup
        if: steps.check-models.outputs.exist == 'true'
        run: |
          # Création setup.py si absent
          if [ ! -f "setup.py" ]; then
            cat > setup.py << 'EOF'
          from setuptools import setup, find_packages
          
          setup(
              name="edge_security_feature",
              version="0.1.0",
              packages=find_packages(),
              install_requires=[
                  'opencv-python>=4.8.0',
                  'numpy>=1.24.0',
                  'tflite-runtime>=2.14.0',
              ],
              python_requires='>=3.8',
          )
          EOF
          fi
          
          pip install -e .
          [ -f "requirements.txt" ] && pip install -r requirements.txt || pip install opencv-python numpy tflite-runtime
          
          # Test d'import et chargement modèle
          python - << 'PY'
          import sys, os
          sys.path.insert(0, '.')
          try:
              from app.inference import EdgeDetector
              model_files = [f for f in os.listdir('models') if f.endswith('.tflite')]
              if model_files:
                  detector = EdgeDetector(f'models/{model_files[0]}')
                  print(f"SUCCÈS: Modèle chargé ({detector.input_width}x{detector.input_height})")
              print("Validation réussie")
          except Exception as e:
              print(f"ERREUR: {e}")
              import traceback; traceback.print_exc()
              exit(1)
          PY
          
          echo "success=true" >> $GITHUB_OUTPUT

      - name: Tests de base
        if: steps.check-models.outputs.exist == 'true' && steps.validate-setup.outputs.success == 'true'
        run: |
          cat > basic_test.py << 'EOF'
          import sys, os, numpy as np
          sys.path.insert(0, os.getcwd())
          from app.inference import EdgeDetector
          
          print("=== TESTS DE BASE - feature/add ===")
          model_files = [f for f in os.listdir('models') if f.endswith('.tflite')]
          if not model_files:
              print("Aucun modèle trouvé")
              exit(1)
          
          for model_file in model_files[:2]:
              print(f"\nTest: {model_file}")
              detector = EdgeDetector(f"models/{model_file}")
              test_img = np.random.randint(0, 255, (320, 320, 3), dtype=np.uint8)
              boxes, classes, scores, latency = detector.predict(test_img)
              print(f"Inférence: {latency:.1f}ms, {len(scores)} détections")
          
          print("Tests de base réussis")
          EOF
          
          python basic_test.py

  # ===========================================
  # JOB 2: BENCHMARK PERFORMANCE
  # ===========================================
  performance-benchmark:
    name: Benchmark Performance
    needs: setup-and-validation
    if: needs.setup-and-validation.outputs.models_exist == 'true' && needs.setup-and-validation.outputs.setup_success == 'true'
    runs-on: ubuntu-latest-4-cores
    timeout-minutes: 20

    outputs:
      production_ready_count: ${{ steps.run-benchmark.outputs.production_ready_count }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/add

      - name: Installation environnement
        run: |
          pip install -e .
          pip install opencv-python numpy pandas
          
          if [ -f "models.dvc" ] && [ ! "$(ls -A models/*.tflite 2>/dev/null)" ]; then
            pip install "dvc[gdrive]"
            mkdir -p ~/.config/dvc/tmp
            echo "${{ secrets.GDRIVE_CREDENTIALS_JSON }}" > ~/.config/dvc/tmp/gdrive-user-credentials.json
            dvc pull models.dvc
          fi

      - name: Exécution du benchmark
        id: run-benchmark
        env:
          TF_ENABLE_ONEDNN_OPTS: "0"
        run: |
          cat > benchmark.py << 'EOF'
          import os, json, numpy as np, time, pandas as pd
          from app.inference import EdgeDetector
          
          results = []
          for model_file in os.listdir('models'):
              if not model_file.endswith('.tflite'): continue
              model_path = f"models/{model_file}"
              try:
                  detector = EdgeDetector(model_path)
                  test_img = np.random.randint(0, 255, (480, 640, 3), dtype=np.uint8)
                  for _ in range(3): detector.predict(test_img)  # warm-up
                  
                  latencies = []
                  for _ in range(15):
                      start = time.perf_counter()
                      _, _, _, latency = detector.predict(test_img)
                      latencies.append(latency)
                  
                  avg = np.mean(latencies)
                  fps = 1000 / avg if avg > 0 else 0
                  meets = fps >= 15 and avg <= 100
                  
                  results.append({
                      "model": model_file,
                      "size_mb": round(os.path.getsize(model_path) / (1024*1024), 2),
                      "avg_latency_ms": round(avg, 2),
                      "fps": round(fps, 2),
                      "meets_requirements": meets
                  })
              except Exception as e:
                  print(f"Erreur sur {model_file}: {e}")
          
          with open('benchmark_results.json', 'w') as f:
              json.dump(results, f, indent=2)
          
          ready_count = sum(r["meets_requirements"] for r in results)
          print(f"::set-output name=production_ready_count::{ready_count}")
          EOF
          
          python benchmark.py

      - name: Upload résultats benchmark
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-feature-results
          path: benchmark_results.json
          retention-days: 7

  # ===========================================
  # JOB 3: ENREGISTREMENT MLFLOW (STAGING)
  # ===========================================
  mlflow-registration-staging:
    name: Enregistrement MLflow - Staging
    needs: performance-benchmark
    if: ${{ success() && github.event.inputs.test_mode != 'benchmark-only' }}
    runs-on: ubuntu-latest-4-cores
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/add

      - name: Installation et récupération modèles
        run: |
          pip install mlflow pandas
          pip install -e .
          
          if [ ! -d "models" ] || [ -z "$(ls models/*.tflite 2>/dev/null)" ]; then
            pip install "dvc[gdrive]"
            mkdir -p ~/.config/dvc/tmp
            echo "${{ secrets.GDRIVE_CREDENTIALS_JSON }}" > ~/.config/dvc/tmp/gdrive-user-credentials.json
            dvc pull models.dvc
          fi

      - name: Enregistrement MLflow
        env:
          MLFLOW_TRACKING_URI: ${{ env.MLFLOW_TRACKING_URI }}
        run: |
          cat > register_staging.py << 'EOF'
          import mlflow, os, json
          from datetime import datetime
          
          mlflow.set_experiment("Edge_Security_Feature_Staging")
          benchmark = []
          if os.path.exists('benchmark_results.json'):
              with open('benchmark_results.json') as f:
                  benchmark = json.load(f)
          
          registered = []
          for model_file in os.listdir('models'):
              if not model_file.endswith('.tflite'): continue
              model_path = f"models/{model_file}"
              name = model_file.replace('.tflite', '')
              
              bm = next((b for b in benchmark if b['model'] == model_file), None)
              
              with mlflow.start_run(run_name=f"feature_add_{name}_{datetime.now():%Y%m%d_%H%M}"):
                  mlflow.log_params({
                      "model_name": name, "branch": "feature/add",
                      "quantization": "int8" if "int8" in name.lower() else "float32",
                      "framework": "tensorflow_lite", "environment": "staging",
                      "git_commit": "${{ github.sha }}"
                  })
                  if bm:
                      mlflow.log_metrics({
                          "fps": bm['fps'], "latency_ms": bm['avg_latency_ms'],
                          "model_size_mb": bm['size_mb']
                      })
                  mlflow.log_artifact(model_path, "models")
                  mlflow.log_artifact("app/inference.py", "code")
                  registered.append(model_file)
          
          report = {"total_registered": len(registered), "models": registered, "branch": "feature/add"}
          with open('staging_registration_report.json', 'w') as f:
              json.dump(report, f, indent=2)
          EOF
          
          python register_staging.py

      - name: Upload rapport MLflow
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-staging-reports
          path: |
            staging_registration_report.json
          retention-days: 7

  # ===========================================
  # JOB 4: RAPPORT FINAL
  # ===========================================
  final-report:
    name: Rapport Final
    needs: [setup-and-validation, performance-benchmark, mlflow-registration-staging]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Téléchargement artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*'
          path: artifacts

      - name: Génération rapport final
        run: |
          cat > final_feature_report.md << 'EOF'
          # Rapport Pipeline MLOps - Branche feature/add
          
          **Projet:** Détection d'intrusion Edge Security  
          **Date:** $(date)  
          **Branche:** feature/add  
          **Commit:** ${{ github.sha }}  
          **Run ID:** ${{ github.run_id }}
          
          ## Statut des étapes
          | Étape                  | Statut                     | Détails                              |
          |------------------------|----------------------------|--------------------------------------|
          | Setup & Validation     | ${{ needs.setup-and-validation.result }} | ${{ needs.setup-and-validation.outputs.models_count || 0 }} modèles |
          | Benchmark Performance  | ${{ needs.performance-benchmark.result }} | ${{ needs.performance-benchmark.outputs.production_ready_count || 0 }} prêts |
          | MLflow Staging         | ${{ needs.mlflow-registration-staging.result }} | Enregistrement staging |
          
          ## Performance des modèles
          EOF
          
          if [ -f "artifacts/benchmark-feature-results/benchmark_results.json" ]; then
            python - << 'PY'
          import json
          with open('artifacts/benchmark-feature-results/benchmark_results.json') as f:
              data = json.load(f)
          print("| Modèle | Taille (MB) | FPS | Latence (ms) | Prêt |")
          print("|--------|-------------|-----|--------------|------|")
          ready = 0
          for m in data:
              r = "OUI" if m['meets_requirements'] else "NON"
              if m['meets_requirements']: ready += 1
              print(f"| {m['model']} | {m['size_mb']:.1f} | {m['fps']:.1f} | {m['avg_latency_ms']:.1f} | {r} |")
          print(f"\n**Modèles prêts production:** {ready}/{len(data)}")
          PY
            >> final_feature_report.md
          else
            echo "Aucune donnée de benchmark disponible" >> final_feature_report.md
          fi
          
          cat >> final_feature_report.md << 'EOF'
          
          ## Recommandations
          1. Vérifier que tous les tests passent
          2. S'assurer que les modèles atteignent ≥15 FPS et ≤100ms
          3. Créer une PR vers main une fois validé
          4. Mettre à jour la documentation si nécessaire
          
          ## Artifacts disponibles
          - benchmark_results.json
          - staging_registration_report.json
          EOF
          
          cat final_feature_report.md

      - name: Upload rapport final
        uses: actions/upload-artifact@v4
        with:
          name: feature-pipeline-final-report
          path: final_feature_report.md
          retention-days: 30