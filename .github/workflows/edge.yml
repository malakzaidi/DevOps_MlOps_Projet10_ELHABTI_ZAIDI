name: MLOps Edge AI - Real TFLite Models Dashboard

on:
  push:
    branches: [ feature/add ]
  pull_request:
    branches: [ feature/add ]
  workflow_dispatch:

env:
  MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
  PYTHON_VERSION: '3.11'
  DVC_REMOTE_NAME: 'vdrive'

jobs:
  setup-and-data:
    name: 1. Data & Environment Setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install DVC
        run: |
          pip install "dvc[gdrive]==3.41.0"

      - name: Pull Models from DVC
        env:
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS_JSON }}
        run: |
          mkdir -p ~/.dvc
          echo "$GDRIVE_CREDENTIALS" > ~/.dvc/gdrive_service_account.json
          dvc remote modify --local ${{ env.DVC_REMOTE_NAME }} gdrive_use_service_account true
          dvc remote modify --local ${{ env.DVC_REMOTE_NAME }} gdrive_service_account_json_file_path ~/.dvc/gdrive_service_account.json
          dvc pull models.dvc || echo "DVC pull failed, continuing..."

      - name: Upload Models
        uses: actions/upload-artifact@v4
        with:
          name: edge-models
          path: models/

  benchmark-x86-fp32:
    name: 2. x86 Cloud - Float32 (FP32)
    needs: setup-and-data
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Models
        uses: actions/download-artifact@v4
        with:
          name: edge-models
          path: models/

      - name: Install Dependencies
        run: pip install tflite-runtime psutil numpy

      - name: Run Benchmark
        run: |
          mkdir -p results
          python3 benchmark.py --output results/x86_fp32.json --device "x86 Cloud" --precision fp32

      - name: Upload Results
        uses: actions/upload-artifact@v4
        with:
          name: x86-fp32-results
          path: results/x86_fp32.json

  benchmark-x86-int8:
    name: 3. x86 Cloud - INT8 Quantized
    needs: setup-and-data
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Models
        uses: actions/download-artifact@v4
        with:
          name: edge-models
          path: models/

      - name: Install Dependencies
        run: pip install tflite-runtime psutil numpy

      - name: Run Benchmark
        run: |
          mkdir -p results
          python3 benchmark.py --output results/x86_int8.json --device "x86 Cloud" --precision int8

      - name: Upload Results
        uses: actions/upload-artifact@v4
        with:
          name: x86-int8-results
          path: results/x86_int8.json

  benchmark-arm64-int8:
    name: 4. ARM64 Edge - INT8 Quantized (Native ARM64 Hardware)
    needs: setup-and-data
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Models
        uses: actions/download-artifact@v4
        with:
          name: edge-models
          path: models/

      - name: Install Dependencies
        run: pip install tflite-runtime psutil numpy

      - name: Run Benchmark
        run: |
          mkdir -p results
          python3 benchmark.py --output results/arm64_int8.json --device "ARM64 Edge" --precision int8

      - name: Upload Results
        uses: actions/upload-artifact@v4
        with:
          name: arm64-int8-results
          path: results/arm64_int8.json

  reporting:
    name: 5. Real Performance Dashboard
    needs: [benchmark-x86-fp32, benchmark-x86-int8, benchmark-arm64-int8]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Dependencies
        run: pip install matplotlib pandas

      - name: Download All Results
        uses: actions/download-artifact@v4
        with:
          path: all-results/

      - name: Generate Report & Chart
        run: |
          mkdir -p scripts
          cat > scripts/generate_report.py << EOF
          import json
          import matplotlib.pyplot as plt
          import pandas as pd
          from pathlib import Path
          from datetime import datetime

          def load_metrics(path):
              p = Path(path)
              if not p.exists():
                  raise FileNotFoundError(f"Missing: {path}")
              with open(p) as f:
                  data = json.load(f)
              required = ['avg_latency_ms', 'fps', 'model_size_mb', 'peak_memory_mb']
              for k in required:
                  if data.get(k, 0) <= 0:
                      raise ValueError(f"Invalid {k} in {path}")
              return data

          try:
              fp32 = load_metrics("all-results/x86-fp32-results/x86_fp32.json")
              int8_x86 = load_metrics("all-results/x86-int8-results/x86_int8.json")
              int8_arm = load_metrics("all-results/arm64-int8-results/arm64_int8.json")
          except Exception as e:
              print(f"Benchmark data invalid: {e}")
              exit(1)

          metrics = ['Latency (ms)', 'FPS', 'Model Size (MB)', 'Peak Memory (MB)']
          df_data = {
              'Configuration': metrics,
              'x86 FP32': [fp32['avg_latency_ms'], fp32['fps'], fp32['model_size_mb'], fp32['peak_memory_mb']],
              'x86 INT8': [int8_x86['avg_latency_ms'], int8_x86['fps'], int8_x86['model_size_mb'], int8_x86['peak_memory_mb']],
              'ARM64 INT8': [int8_arm['avg_latency_ms'], int8_arm['fps'], int8_arm['model_size_mb'], int8_arm['peak_memory_mb']]
          }
          df = pd.DataFrame(df_data).set_index('Configuration')

          ax = df.plot(kind='bar', figsize=(14, 8), width=0.8)
          ax.set_title('Real TFLite Model Performance Comparison\n(Lower latency/memory = better | Higher FPS = better)', fontsize=16)
          ax.set_ylabel('Value')
          ax.legend(title='Configuration')
          plt.xticks(rotation=15)
          plt.tight_layout()
          plt.savefig('performance_comparison.png', dpi=150)

          report = f"""# Real Edge AI Performance Dashboard ({datetime.now().strftime('%Y-%m-%d')})

          | Metric              | x86 FP32 (Baseline) | x86 INT8 (Quantized) | ARM64 INT8 (Edge) | INT8 Speedup vs FP32 | Edge vs x86 INT8 |
          |---------------------|---------------------|----------------------|-------------------|----------------------|------------------|
          | **Latency (ms)**    | {fp32['avg_latency_ms']:.2f} | {int8_x86['avg_latency_ms']:.2f} | {int8_arm['avg_latency_ms']:.2f} | {fp32['avg_latency_ms']/int8_x86['avg_latency_ms']:.1f}× faster | {int8_arm['avg_latency_ms']/int8_x86['avg_latency_ms']:.1f}× slower |
          | **FPS**             | {fp32['fps']:.1f}       | {int8_x86['fps']:.1f}       | {int8_arm['fps']:.1f}       | {int8_x86['fps']/fp32['fps']:.1f}× faster | {int8_x86['fps']/int8_arm['fps']:.1f}× slower |
          | **Model Size (MB)** | {fp32['model_size_mb']:.1f} | {int8_x86['model_size_mb']:.1f} | {int8_arm['model_size_mb']:.1f} | ~75% smaller | same |
          | **Peak Memory (MB)**| {fp32['peak_memory_mb']:.1f} | {int8_x86['peak_memory_mb']:.1f} | {int8_arm['peak_memory_mb']:.1f} | reduced | similar |

          ## Insights
          - Real inference using your `model_float32.tflite` and `model_int8.tflite`
          - ARM64 results from native hardware (GitHub-hosted Graviton-like runner)
          - Architecture detected: {int8_arm.get('architecture', 'N/A')}

          ---
          *Auto-generated by MLOps pipeline*
          """
          Path("final_report.md").write_text(report)
          EOF

          python3 scripts/generate_report.py

      - name: Publish to Job Summary
        run: cat final_report.md >> $GITHUB_STEP_SUMMARY

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: performance-dashboard
          path: |
            performance_comparison.png
            final_report.md