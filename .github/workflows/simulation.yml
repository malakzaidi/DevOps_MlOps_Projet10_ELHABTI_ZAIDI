name: MLOps Edge CI Pipeline

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:

env:
  PYTHON_VERSION: "3.11"

jobs:
  ci:
    name: Edge Production CI
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install runtime dependencies
        run: |
          pip install numpy opencv-python tflite-runtime ruff

      # =========================
      # LINTING (PRODUCTION ONLY)
      # =========================
      - name: Lint production code
        run: |
          ruff check app/

      # =========================
      # MODEL CHECK
      # =========================
      - name: Check TFLite models
        id: models
        run: |
          if [ -d "models" ] && ls models/*.tflite > /dev/null 2>&1; then
            echo "found=true" >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
          fi

      # =========================
      # BASIC INFERENCE TEST
      # =========================
      - name: Inference sanity test
        if: steps.models.outputs.found == 'true'
        run: |
          python << 'EOF'
          import numpy as np
          import os
          from app.inference import EdgeDetector

          model = [m for m in os.listdir("models") if m.endswith(".tflite")][0]
          detector = EdgeDetector(f"models/{model}")

          img = np.random.randint(0, 255, (320, 320, 3), dtype=np.uint8)
          result = detector.predict(img)

          assert result is not None
          print("Inference OK")
          EOF

      # =========================
      # LIGHT PERFORMANCE CHECK
      # =========================
      - name: CPU latency check
        if: steps.models.outputs.found == 'true'
        run: |
          python << 'EOF'
          import time
          import numpy as np
          import os
          from app.inference import EdgeDetector

          model = [m for m in os.listdir("models") if m.endswith(".tflite")][0]
          detector = EdgeDetector(f"models/{model}")

          img = np.random.randint(0, 255, (480, 640, 3), dtype=np.uint8)

          times = []
          for _ in range(5):
              t0 = time.perf_counter()
              detector.predict(img)
              times.append((time.perf_counter() - t0) * 1000)

          avg = sum(times) / len(times)
          print(f"Average latency: {avg:.2f} ms")
          EOF

      # =========================
      # REPORT
      # =========================
      - name: Generate CI report
        run: |
          cat << EOF > ci_report.md
          # Edge MLOps CI Report

          - Python: ${{ env.PYTHON_VERSION }}
          - Models present: ${{ steps.models.outputs.found }}
          - Lint scope: app/
          - Status: SUCCESS
          EOF

      - name: Upload CI report
        uses: actions/upload-artifact@v4
        with:
          name: ci-report
          path: ci_report.md
