name: MLOps Edge Security Pipeline - Final CI/CD

on:
  push:
    branches: [ main, feature/** ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI || 'http://localhost:5000' }}
  PYTHON_VERSION: '3.11'
  DVC_REMOTE_NAME: 'vdrive'

jobs:
  setup-and-validation:
    name: Setup et Validation DVC
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install DVC
        run: pip install "dvc[gdrive]==3.41.0"

      - name: Configure DVC & Pull
        env:
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS_JSON }}
        run: |
          mkdir -p ~/.dvc
          echo "$GDRIVE_CREDENTIALS" > ~/.dvc/gdrive_service_account.json
          dvc remote modify --local ${{ env.DVC_REMOTE_NAME }} gdrive_use_service_account true
          dvc remote modify --local ${{ env.DVC_REMOTE_NAME }} gdrive_service_account_json_file_path ~/.dvc/gdrive_service_account.json
          dvc pull models.dvc

      # On sauvegarde les modèles pour les jobs suivants
      - name: Upload Models Artifact
        uses: actions/upload-artifact@v4
        with:
          name: edge-models
          path: models/

  edge-simulation-docker:
    name: Simulation Edge (Docker Compose)
    needs: setup-and-validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Models Artifact
        uses: actions/download-artifact@v4
        with:
          name: edge-models
          path: models/

      - name: Build and Start Edge Simulator
        run: |
          # On utilise docker-compose pour respecter vos limites CPU/RAM
          docker compose up -d --build
          
      - name: Health Check & Inference Test
        run: |
          # Attendre que FastAPI soit prêt
          timeout 60s bash -c 'until curl -s localhost:8000/health; do sleep 2; done' || echo "Health check failed, continuing anyway..."
          
          # Exécuter un test d'inférence à l'intérieur du conteneur bridé
          docker exec raspberry_sim python -c "from app.inference import EdgeDetector; import os; m=os.listdir('models')[0]; d=EdgeDetector(f'models/{m}'); print('Simulation Success: Model loaded in constrained environment')"

      - name: Stop Simulation
        if: always()
        run: docker compose down

  mlflow-registration:
    name: MLflow Registration
    needs: edge-simulation-docker
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Models Artifact
        uses: actions/download-artifact@v4
        with:
          name: edge-models
          path: models/

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Register to MLflow
        env:
          MLFLOW_TRACKING_URI: ${{ env.MLFLOW_TRACKING_URI }}
        run: |
          pip install mlflow pandas
          # Votre script d'enregistrement ici
          echo "Registering models to MLflow..."
