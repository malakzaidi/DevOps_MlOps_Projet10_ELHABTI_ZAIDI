name: MLOps Edge CI Pipeline

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:

env:
  PYTHON_VERSION: "3.11"

jobs:
  ci:
    name: Edge Model CI
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          pip install numpy opencv-python tflite-runtime
          pip install ruff

      # =========================
      # CODE QUALITY
      # =========================
      - name: Lint code with Ruff
        run: |
          ruff check .

      # =========================
      # MODEL CHECK
      # =========================
      - name: Check models directory
        id: models
        run: |
          if [ -d "models" ] && ls models/*.tflite > /dev/null 2>&1; then
            echo "found=true" >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
          fi

      # =========================
      # BASIC INFERENCE TEST
      # =========================
      - name: Run inference test
        if: steps.models.outputs.found == 'true'
        run: |
          python << 'EOF'
          import numpy as np
          import os
          from app.inference import EdgeDetector

          models = [m for m in os.listdir("models") if m.endswith(".tflite")]
          assert models, "No model found"

          model_path = os.path.join("models", models[0])
          detector = EdgeDetector(model_path)

          img = np.random.randint(0, 255, (320, 320, 3), dtype=np.uint8)
          outputs = detector.predict(img)

          assert outputs is not None
          print("Inference test passed")
          EOF

      # =========================
      # PERFORMANCE BENCHMARK
      # =========================
      - name: CPU benchmark
        if: steps.models.outputs.found == 'true'
        run: |
          python << 'EOF'
          import time
          import numpy as np
          import os
          from app.inference import EdgeDetector

          model = [m for m in os.listdir("models") if m.endswith(".tflite")][0]
          detector = EdgeDetector(f"models/{model}")

          img = np.random.randint(0, 255, (480, 640, 3), dtype=np.uint8)

          latencies = []
          for _ in range(10):
            start = time.perf_counter()
            detector.predict(img)
            latencies.append((time.perf_counter() - start) * 1000)

          avg = sum(latencies) / len(latencies)
          fps = 1000 / avg if avg > 0 else 0

          print(f"Average latency: {avg:.2f} ms")
          print(f"Estimated FPS: {fps:.2f}")
          EOF

      # =========================
      # REPORT
      # =========================
      - name: Generate CI report
        run: |
          cat << EOF > ci_report.md
          # CI Report

          - Python version: ${{ env.PYTHON_VERSION }}
          - Models present: ${{ steps.models.outputs.found }}
          - Status: SUCCESS
          EOF

      - name: Upload CI report
        uses: actions/upload-artifact@v4
        with:
          name: ci-report
          path: ci_report.md
