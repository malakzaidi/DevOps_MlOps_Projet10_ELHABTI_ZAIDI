name: MLOps Edge Security Pipeline - Feature Branch

on:
  push:
    branches: [ feature/add ]
    paths:
      - 'app/**'
      - 'models.dvc'
      - 'data.dvc'
      - 'scripts/**'
      - 'requirements.txt'
      - 'setup.py'

  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Mode de test détaillé'
        required: false
        default: 'basic'
        type: choice
        options:
          - basic
          - full
          - benchmark-only

env:
  MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI || 'http://localhost:5000' }}
  PYTHON_VERSION: '3.11'

jobs:
  setup-and-validation:
    name: Setup and Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      models_exist: ${{ steps.check-models.outputs.exist }}
      models_count: ${{ steps.check-models.outputs.count }}
      setup_success: ${{ steps.validate-setup.outputs.success }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install DVC and dependencies
        run: |
          pip install "dvc[gdrive]==3.41.0"
          pip install opencv-python numpy tflite-runtime

      - name: Configure DVC Service Account
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_CREDENTIALS_JSON }}
        run: |
          if [ -z "$SERVICE_ACCOUNT_JSON" ]; then
            echo "Error: GDRIVE_CREDENTIALS_JSON secret missing"
            exit 1
          fi
          
          mkdir -p ~/.dvc
          echo "$SERVICE_ACCOUNT_JSON" > ~/.dvc/gdrive_service_account.json
          
          REMOTE_NAME=$(dvc remote list | head -n1 | awk '{print $1}' || echo "vdrive")
          
          dvc remote modify --local "$REMOTE_NAME" gdrive_use_service_account true
          dvc remote modify --local "$REMOTE_NAME" gdrive_service_account_json_file_path ~/.dvc/gdrive_service_account.json
          dvc remote modify --local "$REMOTE_NAME" gdrive_acknowledge_abuse true

      - name: Pull models from DVC
        run: |
          dvc pull models.dvc --verbose

      - name: Check models presence
        id: check-models
        run: |
          if [ ! -d "models" ]; then
            echo "exist=false" >> $GITHUB_OUTPUT
            echo "count=0" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          count=$(find models -name "*.tflite" -type f | wc -l)
          echo "exist=$([ $count -gt 0 ] && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "count=$count" >> $GITHUB_OUTPUT

      - name: Install package and validate loading
        id: validate-setup
        if: steps.check-models.outputs.exist == 'true'
        run: |
          if [ ! -f "setup.py" ]; then
            cat > setup.py << 'EOF'
          from setuptools import setup, find_packages
          setup(
              name="edge_security_feature",
              version="0.1.0",
              packages=find_packages(),
              install_requires=['opencv-python', 'numpy', 'tflite-runtime'],
              python_requires='>=3.8',
          )
          EOF
          fi
          
          pip install -e .
          [ -f "requirements.txt" ] && pip install -r requirements.txt
          
          python - << 'PY'
          from app.inference import EdgeDetector
          import os
          models = [f for f in os.listdir('models') if f.endswith('.tflite')]
          if models:
              detector = EdgeDetector(f"models/{models[0]}")
              print("Model loaded successfully on x86")
          PY
          
          echo "success=true" >> $GITHUB_OUTPUT

      - name: Basic inference tests
        if: steps.check-models.outputs.exist == 'true' && steps.validate-setup.outputs.success == 'true'
        run: |
          python - << 'PY'
          import numpy as np
          from app.inference import EdgeDetector
          import os
          
          models = [f for f in os.listdir('models') if f.endswith('.tflite')][:2]
          for m in models:
              detector = EdgeDetector(f"models/{m}")
              img = np.random.randint(0, 255, (320, 320, 3), dtype=np.uint8)
              _, _, _, latency = detector.predict(img)
              print(f"{m}: inference latency {latency:.1f} ms")
          PY

  performance-benchmark:
    name: Performance Benchmark (x86)
    needs: setup-and-validation
    if: needs.setup-and-validation.outputs.models_exist == 'true' && needs.setup-and-validation.outputs.setup_success == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      production_ready_count: ${{ steps.run-benchmark.outputs.production_ready_count }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install tflite-runtime opencv-python numpy pandas "dvc[gdrive]==3.41.0"

      - name: Configure DVC Service Account
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_CREDENTIALS_JSON }}
        run: |
          mkdir -p ~/.dvc
          echo "$SERVICE_ACCOUNT_JSON" > ~/.dvc/gdrive_service_account.json
          
          REMOTE_NAME=$(dvc remote list | head -n1 | awk '{print $1}' || echo "vdrive")
          
          dvc remote modify --local "$REMOTE_NAME" gdrive_use_service_account true
          dvc remote modify --local "$REMOTE_NAME" gdrive_service_account_json_file_path ~/.dvc/gdrive_service_account.json
          dvc remote modify --local "$REMOTE_NAME" gdrive_acknowledge_abuse true

      - name: Pull models if needed
        run: |
          if [ ! "$(ls -A models/*.tflite 2>/dev/null)" ]; then
            dvc pull models.dvc
          fi

      - name: Run performance benchmark
        id: run-benchmark
        env:
          TF_ENABLE_ONEDNN_OPTS: "0"
        run: |
          cat > benchmark.py << 'EOF'
          import os
          import json
          import numpy as np
          import time
          from app.inference import EdgeDetector
          
          results = []
          model_files = [f for f in os.listdir('models') if f.endswith('.tflite')]
          
          for model_file in model_files:
              model_path = f"models/{model_file}"
              detector = EdgeDetector(model_path)
              test_img = np.random.randint(0, 255, (480, 640, 3), dtype=np.uint8)
              
              # Warm-up
              for _ in range(3):
                  detector.predict(test_img)
              
              # Benchmark
              latencies = []
              for _ in range(15):
                  start = time.perf_counter()
                  _, _, _, latency = detector.predict(test_img)
                  latencies.append(latency)
              
              avg_latency = np.mean(latencies)
              fps = 1000 / avg_latency if avg_latency > 0 else 0
              meets_requirements = fps >= 15 and avg_latency <= 100
              
              results.append({
                  "model": model_file,
                  "size_mb": round(os.path.getsize(model_path) / (1024*1024), 2),
                  "avg_latency_ms": round(avg_latency, 2),
                  "fps": round(fps, 2),
                  "meets_requirements": meets_requirements
              })
          
          with open('benchmark_results.json', 'w') as f:
              json.dump(results, f, indent=2)
          
          ready_count = sum(r["meets_requirements"] for r in results)
          echo "production_ready_count=$ready_count" >> $GITHUB_OUTPUT
          EOF
          
          python benchmark.py

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-x86-results
          path: benchmark_results.json
          retention-days: 7

  raspberry-pi-simulation:
    name: Raspberry Pi 4 Simulation (ARM64)
    needs: setup-and-validation
    if: needs.setup-and-validation.outputs.models_exist == 'true' && needs.setup-and-validation.outputs.setup_success == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup QEMU for ARM64 emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Run ARM64 container with Raspberry Pi-like environment
        uses: addnab/docker-run-action@v3
        with:
          image: python:3.11-slim
          options: --platform linux/arm64 -v ${{ github.workspace }}:/workspace -w /workspace
          run: |
            apt-get update && apt-get install -y libatlas-base-dev libopencv-dev libjpeg-dev libpng-dev libtiff-dev libopenjp2-7-dev
            pip install numpy opencv-python tflite-runtime
            
            # Copy models from host
            cp -r models /workspace/models
            
            # Run inference test on simulated Raspberry Pi
            python - << 'PY'
            import numpy as np
            from app.inference import EdgeDetector
            import os
            import time
            
            models = [f for f in os.listdir('models') if f.endswith('.tflite')]
            if not models:
                print("No model found")
                exit(1)
            
            print(f"Testing on simulated Raspberry Pi 4 (ARM64): {models[0]}")
            
            detector = EdgeDetector(f"models/{models[0]}")
            
            test_img = np.random.randint(0, 255, (480, 640, 3), dtype=np.uint8)
            
            # Warm-up
            for _ in range(5):
                detector.predict(test_img)
            
            # Measure latency
            latencies = []
            for _ in range(20):
                start = time.perf_counter()
                _, _, _, latency = detector.predict(test_img)
                latencies.append(latency * 1000)  # ms
            
            avg_ms = sum(latencies) / len(latencies)
            fps = 1000 / avg_ms if avg_ms > 0 else 0
            
            print(f"Average inference latency: {avg_ms:.1f} ms")
            print(f"Estimated FPS: {fps:.1f}")
            print(f"Target met (>=15 FPS): {'Yes' if fps >= 15 else 'No'}")
            PY

  final-report:
    name: Final Report
    needs: [setup-and-validation, performance-benchmark, raspberry-pi-simulation]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*'
          path: artifacts
          merge-multiple: true

      - name: Generate final report
        run: |
          cat > final_report.md << 'EOF'
          # MLOps Pipeline Report - Feature Branch

          Date: $(date)
          Branch: ${{ github.ref_name }}
          Commit: ${{ github.sha }}

          ## Validation Status
          - Models detected: ${{ needs.setup-and-validation.outputs.models_count }}
          - Validation: ${{ needs.setup-and-validation.result }}

          ## x86 Benchmark
          - Status: ${{ needs.performance-benchmark.result }}
          - Production ready models: ${{ needs.performance-benchmark.outputs.production_ready_count }}

          ## Raspberry Pi 4 Simulation (ARM64)
          - Status: ${{ needs.raspberry-pi-simulation.result }}
          - Inference tested on emulated ARM64 environment

          Pipeline completed.
          EOF
          
          cat final_report.md

      - name: Upload final report
        uses: actions/upload-artifact@v4
        with:
          name: final-pipeline-report
          path: final_report.md
          retention-days: 30