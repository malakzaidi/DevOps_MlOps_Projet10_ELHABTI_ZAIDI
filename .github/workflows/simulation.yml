name: MLOps Edge Raspberry Pi CI

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:

env:
  PYTHON_VERSION: "3.11"

jobs:
  edge-ci:
    name: Edge CI (x86 validation)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy opencv-python tflite-runtime ruff

      - name: Lint production code
        run: |
          ruff check app/

      - name: Check models
        id: models
        run: |
          if [ -d "models" ] && ls models/*.tflite > /dev/null 2>&1; then
            echo "found=true" >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
          fi

      - name: Inference sanity test (x86)
        if: steps.models.outputs.found == 'true'
        run: |
          python << 'EOF'
          import numpy as np
          import os
          from app.inference import EdgeDetector

          model = [m for m in os.listdir("models") if m.endswith(".tflite")][0]
          detector = EdgeDetector(f"models/{model}")

          img = np.random.randint(0,255,(320,320,3),dtype=np.uint8)
          detector.predict(img)

          print("x86 inference OK")
          EOF

  raspberry-simulation:
    name: Raspberry Pi 4 Simulation (ARM64)
    needs: edge-ci
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable QEMU (ARM64)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Run ARM64 container simulation
        run: |
          docker run --rm --platform linux/arm64 \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            python:3.11-slim \
            sh -c "
              apt-get update &&
              apt-get install -y libgl1 libglib2.0-0 &&
              pip install numpy opencv-python tflite-runtime &&
              python - << 'EOF'
              import numpy as np
              import os
              import time
              import sys

              sys.path.insert(0, '/workspace')

              from app.inference import EdgeDetector

              models = [m for m in os.listdir('/workspace/models') if m.endswith('.tflite')]
              if not models:
                  raise RuntimeError('No TFLite model found')

              model = models[0]
              detector = EdgeDetector(f'/workspace/models/{model}')

              img = np.random.randint(0,255,(480,640,3),dtype=np.uint8)

              # Warmup
              for _ in range(3):
                  detector.predict(img)

              times = []
              for _ in range(10):
                  t0 = time.perf_counter()
                  detector.predict(img)
                  times.append((time.perf_counter() - t0) * 1000)

              avg = sum(times) / len(times)
              fps = 1000 / avg if avg > 0 else 0

              print('--- Raspberry Pi 4 Simulation ---')
              print(f'Average latency: {avg:.2f} ms')
              print(f'Estimated FPS: {fps:.2f}')
              print(f'Realtime target met (>=15 FPS): {fps >= 15}')
              EOF
            "

  final-report:
    name: CI Summary
    needs:
      - edge-ci
      - raspberry-simulation
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Generate report
        run: |
          cat << EOF > final_report.md
          # Edge MLOps CI/CD Report

          - x86 validation: ${{ needs.edge-ci.result }}
          - Raspberry Pi ARM64 simulation: ${{ needs.raspberry-simulation.result }}
          - Target device: Raspberry Pi 4
          - Inference engine: TensorFlow Lite
          - Architecture: Edge AI

          Pipeline executed successfully.
          EOF

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: final-ci-report
          path: final_report.md
