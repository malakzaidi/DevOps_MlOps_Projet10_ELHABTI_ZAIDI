name: Edge AI MLOps CI/CD Pipeline

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_arm:
        description: Run ARM64 Edge Simulation
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]

env:
  PYTHON_VERSION: "3.11"
  DVC_REMOTE_NAME: "vdrive"

permissions:
  contents: write
  security-events: write

jobs:

# ============================================================
# 1. CODE QUALITY & SECURITY
# ============================================================
  code-quality:
    name: Code Quality & Security
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install quality tools
        run: |
          pip install ruff bandit

      - name: Lint code
        run: ruff app/

      - name: Static security analysis
        run: bandit -r app/ -ll

# ============================================================
# 2. DATA & MODEL VALIDATION (DVC)
# ============================================================
  data-model-validation:
    name: Data & Model Validation
    runs-on: ubuntu-latest
    needs: code-quality
    timeout-minutes: 15

    outputs:
      models_exist: ${{ steps.check-models.outputs.exist }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install DVC
        run: pip install "dvc[gdrive]==3.41.0"

      - name: Configure DVC credentials
        env:
          GDRIVE_JSON: ${{ secrets.GDRIVE_CREDENTIALS_JSON }}
        run: |
          mkdir -p ~/.dvc
          echo "$GDRIVE_JSON" > ~/.dvc/gdrive.json
          dvc remote modify --local $DVC_REMOTE_NAME gdrive_use_service_account true
          dvc remote modify --local $DVC_REMOTE_NAME gdrive_service_account_json_file_path ~/.dvc/gdrive.json

      - name: Pull models
        run: dvc pull models.dvc

      - name: Check models
        id: check-models
        run: |
          count=$(ls models/*.tflite 2>/dev/null | wc -l)
          if [ "$count" -gt 0 ]; then
            echo "exist=true" >> $GITHUB_OUTPUT
          else
            echo "exist=false" >> $GITHUB_OUTPUT
            exit 1
          fi

# ============================================================
# 3. FUNCTIONAL MODEL VALIDATION
# ============================================================
  functional-tests:
    name: Functional Model Validation
    runs-on: ubuntu-latest
    needs: data-model-validation
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install numpy opencv-python tflite-runtime

      - name: Run inference test
        run: |
          python - << 'EOF'
          import numpy as np, os
          from app.inference import EdgeDetector

          model = [f for f in os.listdir("models") if f.endswith(".tflite")][0]
          detector = EdgeDetector(f"models/{model}")
          img = np.random.randint(0,255,(320,320,3),dtype=np.uint8)
          _,_,_,lat = detector.predict(img)
          assert lat < 300, "Latency too high"
          print("Functional test passed")
          EOF

# ============================================================
# 4. PERFORMANCE BENCHMARK (x86)
# ============================================================
  benchmark-x86:
    name: Performance Benchmark x86
    runs-on: ubuntu-latest
    needs: functional-tests
    timeout-minutes: 20

    outputs:
      fps_ok: ${{ steps.evaluate.outputs.fps_ok }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install numpy tflite-runtime pandas

      - name: Run benchmark
        run: python scripts/benchmark.py

      - name: Evaluate results
        id: evaluate
        run: |
          fps=$(jq '.[0].fps' benchmark_results.json)
          if (( $(echo "$fps >= 10" | bc -l) )); then
            echo "fps_ok=true" >> $GITHUB_OUTPUT
          else
            echo "fps_ok=false" >> $GITHUB_OUTPUT
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-x86
          path: benchmark_results.json

# ============================================================
# 5. EDGE ARM64 SIMULATION (RASPBERRY PI)
# ============================================================
  edge-arm:
    name: ARM64 Edge Simulation
    runs-on: ubuntu-latest
    needs: benchmark-x86
    if: ${{ github.event.inputs.run_arm != 'false' }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: ARM64 inference test
        run: |
          docker run --rm --platform linux/arm64 \
            -v $PWD:/app -w /app python:3.11-slim \
            bash -c "
              pip install numpy tflite-runtime &&
              python scripts/arm_test.py
            "

# ============================================================
# 6. MODEL PROMOTION (MLOps GATING)
# ============================================================
  model-promotion:
    name: Model Promotion
    runs-on: ubuntu-latest
    needs: edge-arm
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Promote model
        run: |
          echo "Model validated and promoted to production"
          git tag model-production-$(date +%Y%m%d%H%M)
          git push --tags

# ============================================================
# 7. FINAL REPORT
# ============================================================
  final-report:
    name: CI/CD Final Report
    runs-on: ubuntu-latest
    needs:
      - code-quality
      - data-model-validation
      - functional-tests
      - benchmark-x86
      - edge-arm
      - model-promotion
    if: always()

    steps:
      - name: Generate report
        run: |
          cat << EOF > ci_cd_report.md
          # Edge AI MLOps CI/CD Report
          Commit: ${{ github.sha }}
          Branch: ${{ github.ref_name }}

          - Code Quality: ${{ needs.code-quality.result }}
          - Data & Model Validation: ${{ needs.data-model-validation.result }}
          - Functional Tests: ${{ needs.functional-tests.result }}
          - Benchmark x86: ${{ needs.benchmark-x86.result }}
          - ARM Edge Simulation: ${{ needs.edge-arm.result }}
          - Model Promotion: ${{ needs.model-promotion.result }}
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: ci-cd-report
          path: ci_cd_report.md
