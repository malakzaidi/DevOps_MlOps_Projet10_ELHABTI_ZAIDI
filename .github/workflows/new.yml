name: MLOps Edge AI - Final V3

on:
  push:
    branches: [ feature/add ]
  pull_request:
    branches: [ feature/add ]
  workflow_dispatch:

env:
  MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
  PYTHON_VERSION: '3.11'
  DVC_REMOTE_NAME: 'vdrive'

jobs:
  setup-and-data:
    name: 🛠️ Setup & DVC Pull
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: 📦 Install DVC Dependencies
        run: |
          echo "Installing DVC with Google Drive support..."
          pip install "dvc[gdrive]==3.41.0"
          dvc --version

      - name: 🔄 Configure DVC & Pull Data
        env:
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS_JSON }}
        run: |
          echo "Setting up Google Drive credentials for DVC..."
          mkdir -p ~/.dvc
          echo "$GDRIVE_CREDENTIALS" > ~/.dvc/gdrive_service_account.json
          
          echo "Configuring DVC remote: ${{ env.DVC_REMOTE_NAME }}..."
          dvc remote modify --local ${{ env.DVC_REMOTE_NAME }} gdrive_use_service_account true
          dvc remote modify --local ${{ env.DVC_REMOTE_NAME }} gdrive_service_account_json_file_path ~/.dvc/gdrive_service_account.json
          
          echo "Pulling models from DVC..."
          dvc pull models.dvc || echo "⚠️ DVC pull failed, proceeding with existing files if any."

      - name: 📤 Upload Models as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: edge-models
          path: models/
          if-no-files-found: warn

  benchmark-x86:
    name: 💻 Benchmark x86 (Cloud Simulation)
    needs: setup-and-data
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 📥 Download Models
        uses: actions/download-artifact@v4
        with:
          name: edge-models
          path: models/

      - name: 🚀 Build and Run x86 Benchmark
        run: |
          echo "Creating results directory..."
          mkdir -p results
          
          echo "Building Docker image for x86 simulation..."
          docker build -t edge-sim-x86 .
          
          echo "Running benchmark inside Docker with resource constraints (0.5 CPU, 512MB RAM)..."
          docker run --rm \
            --cpus="0.5" \
            --memory="512m" \
            -v $(pwd)/models:/app/models \
            -v $(pwd)/results:/app/results \
            edge-sim-x86 python benchmark.py --output results/x86_metrics.json --device "x86 CPU (Simulated)"
          
          echo "Benchmark completed. Results saved to results/x86_metrics.json"

      - name: 📤 Upload x86 Results
        uses: actions/upload-artifact@v4
        with:
          name: x86-results
          path: results/x86_metrics.json
          if-no-files-found: error

  benchmark-arm64:
    name: 🍓 Simulated Edge Test (ARM64 Cloud)
    needs: setup-and-data
    # Use GitHub-hosted ARM64 runners if available, otherwise fallback to ubuntu-latest
    # Note: 'ubuntu-24.04-arm64' is available for public repos and paid plans
    runs-on: ubuntu-24.04-arm64
    continue-on-error: true # Fallback if ARM64 runner is not available
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 📥 Download Models
        uses: actions/download-artifact@v4
        with:
          name: edge-models
          path: models/

      - name: 🚀 Run Native ARM64 Benchmark
        run: |
          echo "Creating results directory..."
          mkdir -p results
          
          echo "Running benchmark natively on ARM64 hardware..."
          # Ensure dependencies are installed for native run
          pip install -r requirements.txt || echo "Requirements installation skipped or failed"
          
          python3 benchmark.py --output results/arm64_metrics.json --device "ARM64 Cloud (GitHub Hosted)"
          
          echo "Benchmark completed. Results saved to results/arm64_metrics.json"

      - name: 📤 Upload ARM64 Results
        uses: actions/upload-artifact@v4
        with:
          name: arm64-results
          path: results/arm64_metrics.json
          if-no-files-found: error

  reporting:
    name: 📊 Final Report & Summary
    needs: [benchmark-x86, benchmark-arm64]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 📥 Download All Results
        uses: actions/download-artifact@v4
        with:
          path: all-results/

      - name: 📝 Generate Comprehensive Report
        run: |
          echo "Generating final summary report..."
          mkdir -p scripts
          cat > scripts/generate_report.py << 'EOF'
          import json
          import os
          from pathlib import Path

          def load_metrics(path):
              file_path = Path(path)
              if file_path.exists():
                  try:
                      with open(file_path) as f:
                          return json.load(f)
                  except Exception as e:
                      return {"device": "Error", "avg_latency_ms": "N/A", "fps": "N/A", "notes": f"Parse error: {str(e)}"}
              return {"device": "Missing", "avg_latency_ms": "N/A", "fps": "N/A", "notes": "File not generated (check job logs)"}

          x86 = load_metrics("all-results/x86-results/x86_metrics.json")
          arm64 = load_metrics("all-results/arm64-results/arm64_metrics.json")

          report = f"""# 🚀 Edge AI Benchmark Report

          ## 📊 Summary Table
          | Metric | x86 Cloud (Simulated) | ARM64 Cloud (Edge-like) |
          |--------|-----------------------|-------------------------|
          | Device | {x86.get('device', 'N/A')} | {arm64.get('device', 'N/A')} |
          | Latency| {x86.get('avg_latency_ms', 'N/A')} ms | {arm64.get('avg_latency_ms', 'N/A')} ms |
          | FPS    | {x86.get('fps', 'N/A')} | {arm64.get('fps', 'N/A')} |

          ## 💻 x86 Cloud Simulation Details
          - **Status**: {'✅ Success' if x86.get('device') != 'Missing' else '❌ Failed'}
          - **Notes**: {x86.get('notes', 'Simulated on GitHub x86 runner inside Docker')}

          ## 🍓 ARM64 Cloud Simulation Details
          - **Status**: {'✅ Success' if arm64.get('device') != 'Missing' else '❌ Failed'}
          - **Notes**: {arm64.get('notes', 'Simulated on GitHub-hosted ARM64 hardware')}

          ---
          *This report was automatically generated by the MLOps pipeline.*
          """
          Path("final_report.md").write_text(report)
          print(report)
          EOF
          python3 scripts/generate_report.py

      - name: 📢 Job Summary
        run: cat final_report.md >> $GITHUB_STEP_SUMMARY

      - name: 💬 Post Report to PR
        if: github.event_name == 'pull_request'
        uses: thollander/actions-comment-pull-request@v2
        with:
          filePath: final_report.md

      - name: 📤 Upload Final Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: final-report
          path: final_report.md