name: MLOps Edge Security Pipeline - Feature Branch

on:
  push:
    branches: [ feature/add ]
    paths:
      - 'app/**'
      - 'models.dvc'
      - 'data.dvc'
      - 'scripts/**'
      - 'requirements.txt'
      - 'setup.py'
      - '.github/workflows/**'  # Permet de tester les changements du workflow

  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Mode de test détaillé'
        required: false
        default: 'basic'
        type: choice
        options:
          - basic
          - full
          - benchmark-only

env:
  MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI || 'http://localhost:5000' }}
  PYTHON_VERSION: '3.11'

jobs:
  setup-and-validation:
    name: Setup et validation - Branche Feature
    runs-on: ubuntu-latest-4-cores
    timeout-minutes: 15
    outputs:
      models_exist: ${{ steps.check-models.outputs.exist }}
      models_count: ${{ steps.check-models.outputs.count }}
      setup_success: ${{ steps.validate-setup.outputs.success }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install DVC and dependencies
        run: |
          pip install "dvc[gdrive]==3.41.0"
          pip install opencv-python numpy tflite-runtime

      - name: Configure DVC Service Account
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_CREDENTIALS_JSON }}
        run: |
          if [ -z "$SERVICE_ACCOUNT_JSON" ]; then
            echo "Error: GDRIVE_CREDENTIALS_JSON secret missing"
            exit 1
          fi
          
          mkdir -p ~/.dvc
          echo "$SERVICE_ACCOUNT_JSON" > ~/.dvc/gdrive_service_account.json
          
          REMOTE_NAME=$(dvc remote list | head -n1 | awk '{print $1}' || echo "vdrive")
          
          dvc remote modify --local "$REMOTE_NAME" gdrive_use_service_account true
          dvc remote modify --local "$REMOTE_NAME" gdrive_service_account_json_file_path ~/.dvc/gdrive_service_account.json
          dvc remote modify --local "$REMOTE_NAME" gdrive_acknowledge_abuse true

      - name: DVC Pull models
        run: |
          dvc pull models.dvc --verbose

      - name: Check models
        id: check-models
        run: |
          if [ ! -d "models" ]; then
            echo "exist=false" >> $GITHUB_OUTPUT
            echo "count=0" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          count=$(find models -name "*.tflite" -type f | wc -l)
          echo "exist=$([ $count -gt 0 ] && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "count=$count" >> $GITHUB_OUTPUT

      - name: Install package and validate
        id: validate-setup
        if: steps.check-models.outputs.exist == 'true'
        run: |
          if [ ! -f "setup.py" ]; then
            cat > setup.py << 'EOF'
          from setuptools import setup, find_packages
          setup(
              name="edge_security_feature",
              version="0.1.0",
              packages=find_packages(),
              install_requires=['opencv-python', 'numpy', 'tflite-runtime'],
              python_requires='>=3.8',
          )
          EOF
          fi
          
          pip install -e .
          [ -f "requirements.txt" ] && pip install -r requirements.txt
          
          python - << 'PY'
          from app.inference import EdgeDetector
          import os
          models = [f for f in os.listdir('models') if f.endswith('.tflite')]
          if models:
              detector = EdgeDetector(f"models/{models[0]}")
              print("Model loaded successfully")
          PY
          
          echo "success=true" >> $GITHUB_OUTPUT

      - name: Basic tests
        if: steps.check-models.outputs.exist == 'true' && steps.validate-setup.outputs.success == 'true'
        run: |
          python - << 'PY'
          import numpy as np
          from app.inference import EdgeDetector
          import os
          
          models = [f for f in os.listdir('models') if f.endswith('.tflite')][:2]
          for m in models:
              detector = EdgeDetector(f"models/{m}")
              img = np.random.randint(0, 255, (320, 320, 3), dtype=np.uint8)
              _, _, _, latency = detector.predict(img)
              print(f"{m}: inference in {latency:.1f}ms")
          PY

  performance-benchmark:
    name: Benchmark Performance
    needs: setup-and-validation
    if: needs.setup-and-validation.outputs.models_exist == 'true' && needs.setup-and-validation.outputs.setup_success == 'true'
    runs-on: ubuntu-latest-4-cores
    timeout-minutes: 20
    outputs:
      production_ready_count: ${{ steps.run-benchmark.outputs.production_ready_count }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies with proper order
        run: |
          # Install tflite-runtime FIRST before anything else
          pip install --upgrade pip
          pip install tflite-runtime
          
          # Then install other dependencies
          pip install opencv-python numpy pandas
          
          # Install DVC if needed
          pip install "dvc[gdrive]==3.41.0"
          
          # Finally install the package in editable mode
          # This ensures tflite-runtime is not overwritten
          pip install -e . --no-deps
          
          # Verify tflite-runtime is installed
          python -c "import tflite_runtime.interpreter as tflite; print('tflite-runtime OK')"

      - name: Configure DVC Service Account
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_CREDENTIALS_JSON }}
        run: |
          mkdir -p ~/.dvc
          echo "$SERVICE_ACCOUNT_JSON" > ~/.dvc/gdrive_service_account.json
          
          REMOTE_NAME=$(dvc remote list | head -n1 | awk '{print $1}' || echo "vdrive")
          
          dvc remote modify --local "$REMOTE_NAME" gdrive_use_service_account true
          dvc remote modify --local "$REMOTE_NAME" gdrive_service_account_json_file_path ~/.dvc/gdrive_service_account.json
          dvc remote modify --local "$REMOTE_NAME" gdrive_acknowledge_abuse true

      - name: Pull models if needed
        run: |
          if [ ! "$(ls -A models/*.tflite 2>/dev/null)" ]; then
            dvc pull models.dvc
          fi

      - name: Run benchmark
        id: run-benchmark
        env:
          TF_ENABLE_ONEDNN_OPTS: "0"
        run: |
          cat > benchmark.py << 'EOF'
          import os, json, numpy as np, time
          
          # Verify tflite-runtime import before anything else
          try:
              import tflite_runtime.interpreter as tflite
              print("✓ tflite-runtime imported successfully")
          except ImportError as e:
              print(f"✗ Failed to import tflite-runtime: {e}")
              raise
          
          from app.inference import EdgeDetector
          
          print("🚀 Démarrage du benchmark de performance...")
          
          results = []
          model_files = [f for f in os.listdir('models') if f.endswith('.tflite')]
          
          if not model_files:
              print("⚠️ Aucun modèle .tflite trouvé dans le dossier models/")
              with open('benchmark_results.json', 'w') as f:
                  json.dump([], f)
              exit(0)
          
          print(f"📊 {len(model_files)} modèle(s) détecté(s)")
          
          for model_file in model_files:
              print(f"\n🔍 Test du modèle: {model_file}")
              model_path = f"models/{model_file}"
              
              try:
                  detector = EdgeDetector(model_path)
                  test_img = np.random.randint(0, 255, (480, 640, 3), dtype=np.uint8)
                  
                  # Warm-up
                  print("  ⏳ Warm-up (3 itérations)...")
                  for _ in range(3): 
                      detector.predict(test_img)
                  
                  # Benchmark
                  print("  ⚡ Benchmark (15 itérations)...")
                  latencies = []
                  for i in range(15):
                      start = time.perf_counter()
                      _, _, _, latency = detector.predict(test_img)
                      latencies.append(latency)
                  
                  avg = np.mean(latencies)
                  p95 = np.percentile(latencies, 95)
                  fps = 1000 / avg if avg > 0 else 0
                  meets = fps >= 15 and avg <= 100
                  
                  result = {
                      "model": model_file,
                      "size_mb": round(os.path.getsize(model_path) / (1024*1024), 2),
                      "avg_latency_ms": round(avg, 2),
                      "p95_latency_ms": round(p95, 2),
                      "fps": round(fps, 2),
                      "meets_requirements": meets
                  }
                  results.append(result)
                  
                  status = "✅ PASS" if meets else "❌ FAIL"
                  print(f"  {status} | Latence moy: {avg:.1f}ms | FPS: {fps:.1f} | Taille: {result['size_mb']}MB")
                  
              except Exception as e:
                  print(f"  ❌ Erreur lors du test: {e}")
                  results.append({
                      "model": model_file,
                      "error": str(e),
                      "meets_requirements": False
                  })
          
          # Save results
          with open('benchmark_results.json', 'w') as f:
              json.dump(results, f, indent=2)
          
          ready_count = sum(r.get("meets_requirements", False) for r in results)
          
          print(f"\n📈 Résumé du benchmark:")
          print(f"  - Total de modèles testés: {len(results)}")
          print(f"  - Modèles prêts pour production: {ready_count}")
          
          # Output for GitHub Actions
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"production_ready_count={ready_count}\n")
          EOF
          
          python benchmark.py

      - name: Display benchmark summary
        if: always()
        run: |
          if [ -f "benchmark_results.json" ]; then
            echo "## 📊 Résultats du Benchmark" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            python - << 'PY'
          import json
          with open('benchmark_results.json') as f:
              results = json.load(f)
          
          if not results:
              print("Aucun résultat disponible")
              exit(0)
          
          print("| Modèle | Taille | Latence moy. | FPS | Production Ready |")
          print("|--------|--------|--------------|-----|------------------|")
          for r in results:
              if "error" in r:
                  print(f"| {r['model']} | - | ERROR | - | ❌ |")
              else:
                  status = "✅" if r["meets_requirements"] else "❌"
                  print(f"| {r['model']} | {r['size_mb']}MB | {r['avg_latency_ms']}ms | {r['fps']} | {status} |")
          PY
          fi

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-feature-results
          path: benchmark_results.json
          retention-days: 7

  mlflow-registration-staging:
    name: Enregistrement MLflow - Staging
    needs: performance-benchmark
    if: success() && github.event.inputs.test_mode != 'benchmark-only'
    runs-on: ubuntu-latest-4-cores
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies with proper order
        run: |
          pip install --upgrade pip
          pip install tflite-runtime
          pip install mlflow pandas opencv-python numpy
          pip install "dvc[gdrive]==3.41.0"
          pip install -e . --no-deps
          
          # Verify installation
          python -c "import tflite_runtime.interpreter as tflite; print('tflite-runtime OK')"

      - name: Configure DVC Service Account
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_CREDENTIALS_JSON }}
        run: |
          mkdir -p ~/.dvc
          echo "$SERVICE_ACCOUNT_JSON" > ~/.dvc/gdrive_service_account.json
          
          REMOTE_NAME=$(dvc remote list | head -n1 | awk '{print $1}' || echo "vdrive")
          
          dvc remote modify --local "$REMOTE_NAME" gdrive_use_service_account true
          dvc remote modify --local "$REMOTE_NAME" gdrive_service_account_json_file_path ~/.dvc/gdrive_service_account.json
          dvc remote modify --local "$REMOTE_NAME" gdrive_acknowledge_abuse true

      - name: Pull models if needed
        run: |
          if [ ! -d "models" ] || [ -z "$(ls models/*.tflite 2>/dev/null)" ]; then
            dvc pull models.dvc
          fi

      - name: Run MLflow registration
        env:
          MLFLOW_TRACKING_URI: ${{ env.MLFLOW_TRACKING_URI }}
        run: |
          echo "MLflow registration script here"
          # Add your MLflow registration logic

      - name: Upload MLflow report
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-staging-reports
          path: staging_registration_report.json
          retention-days: 7
        continue-on-error: true

  final-report:
    name: Rapport Final
    needs: [setup-and-validation, performance-benchmark, mlflow-registration-staging]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*'
          path: artifacts
          merge-multiple: true
        continue-on-error: true

      - name: Generate final report
        run: |
          echo "# 📋 Rapport Final - Feature Pipeline" > final_feature_report.md
          echo "" >> final_feature_report.md
          echo "**Date**: $(date)" >> final_feature_report.md
          echo "**Branche**: ${{ github.ref_name }}" >> final_feature_report.md
          echo "" >> final_feature_report.md
          
          if [ -f "artifacts/benchmark_results.json" ]; then
            echo "## Résultats du Benchmark" >> final_feature_report.md
            python - << 'PY'
          import json
          with open('artifacts/benchmark_results.json') as f:
              results = json.load(f)
          ready = sum(r.get("meets_requirements", False) for r in results)
          print(f"- **Modèles testés**: {len(results)}")
          print(f"- **Modèles production-ready**: {ready}")
          PY
          fi

      - name: Upload final report
        uses: actions/upload-artifact@v4
        with:
          name: feature-pipeline-final-report
          path: final_feature_report.md
          retention-days: 30
        continue-on-error: true