name: Test DVC Google Drive

on:
  workflow_dispatch:

jobs:
  test-dvc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install DVC
        run: pip install "dvc[gdrive]==3.41.0"
      
      - name: Configure Google Drive
        env:
          GDRIVE_CREDENTIALS_JSON: ${{ secrets.GDRIVE_CREDENTIALS_JSON }}
        run: |
          echo "🔐 Configuration des credentials..."
          mkdir -p ~/.dvc
          echo "$GDRIVE_CREDENTIALS_JSON" > ~/.dvc/gdrive_service_account.json
          
          # Validation
          python3 << 'PY'
          import json, sys
          
          with open('/home/runner/.dvc/gdrive_service_account.json') as f:
              creds = json.load(f)
          
          if creds.get('type') != 'service_account':
              print(f"❌ Type incorrect: {creds.get('type')}")
              sys.exit(1)
          
          print("✅ Credentials valides")
          print(f"   Type: {creds['type']}")
          print(f"   Project: {creds['project_id']}")
          print(f"   Email: {creds['client_email']}")
          PY
          
          # Configuration DVC
          REMOTE_NAME=$(dvc remote list | head -n1 | awk '{print $1}')
          echo "Remote: $REMOTE_NAME"
          
          dvc remote modify --local "$REMOTE_NAME" gdrive_use_service_account true
          dvc remote modify --local "$REMOTE_NAME" gdrive_service_account_json_file_path "$HOME/.dvc/gdrive_service_account.json"
          dvc remote modify --local "$REMOTE_NAME" gdrive_acknowledge_abuse true
      
      - name: Test DVC Pull
        run: |
          echo "📥 Test de récupération des modèles..."
          dvc pull models.dvc --verbose
          
          echo "✅ Pull réussi !"
          ls -lh models/